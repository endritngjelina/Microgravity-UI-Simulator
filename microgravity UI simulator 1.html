<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgravity UI Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f23 100%);
            overflow: hidden;
            height: 100vh;
            cursor: crosshair;
            user-select: none;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: drift 60s linear infinite;
            z-index: 0;
        }

        @keyframes drift {
            from { transform: translateX(0px); }
            to { transform: translateX(-200px); }
        }

        .floating-element {
            position: absolute;
            border-radius: 12px;
            cursor: grab;
            transition: box-shadow 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
            will-change: transform;
        }

        .floating-element:hover {
            box-shadow: 0 0 30px rgba(100, 200, 255, 0.6);
        }

        .floating-element:active {
            cursor: grabbing;
            box-shadow: 0 0 50px rgba(100, 200, 255, 0.8);
        }

        .ui-card {
            background: linear-gradient(135deg, rgba(30, 30, 80, 0.9), rgba(60, 20, 100, 0.8));
            padding: 20px;
            width: 280px;
            min-height: 160px;
            color: white;
        }

        .ui-button {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            padding: 12px 24px;
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            min-width: 140px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ui-button.danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
        }

        .ui-button.warning {
            background: linear-gradient(135deg, #ff9800, #f57c00);
        }

        .ui-button.info {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }

        .ui-toggle {
            background: linear-gradient(135deg, rgba(100, 100, 100, 0.8), rgba(70, 70, 70, 0.9));
            padding: 15px 20px;
            color: white;
            min-width: 180px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-switch {
            width: 50px;
            height: 24px;
            background: #555;
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .toggle-switch.active {
            background: #4CAF50;
        }

        .toggle-slider {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s ease;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(26px);
        }

        .ui-input {
            background: linear-gradient(135deg, rgba(50, 50, 100, 0.9), rgba(70, 40, 120, 0.8));
            padding: 15px;
            width: 250px;
            color: white;
        }

        .ui-input input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 8px 12px;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        .ui-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .ui-card h3 {
            margin-bottom: 12px;
            color: #64B5F6;
            font-size: 18px;
        }

        .ui-card p {
            line-height: 1.6;
            opacity: 0.9;
            font-size: 14px;
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 40, 0.95);
            padding: 20px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            min-width: 280px;
        }

        .control-panel h2 {
            margin-bottom: 15px;
            color: #64B5F6;
            font-size: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            opacity: 0.9;
        }

        .control-group input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        .control-group button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        .physics-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(20, 20, 40, 0.95);
            padding: 15px;
            border-radius: 12px;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 100;
            font-size: 12px;
            min-width: 200px;
        }

        .velocity-trail {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(100, 200, 255, 0.6), transparent);
            z-index: 5;
        }

        .collision-effect {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 100, 100, 0.8), transparent);
            z-index: 15;
            animation: explosion 0.5s ease-out forwards;
        }

        @keyframes explosion {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }

        .floating-element.spinning {
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .element-info {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .floating-element:hover .element-info {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="control-panel">
        <h2>🚀 Microgravity Controls</h2>
        
        <div class="control-group">
            <label>Gravity Strength: <span id="gravityValue">0</span></label>
            <input type="range" id="gravitySlider" min="0" max="500" value="0">
        </div>
        
        <div class="control-group">
            <label>Air Resistance: <span id="dampingValue">0.98</span></label>
            <input type="range" id="dampingSlider" min="0.9" max="1" step="0.01" value="0.98">
        </div>
        
        <div class="control-group">
            <button onclick="addRandomElement()">Add Element</button>
            <button onclick="resetSimulation()">Reset All</button>
            <button onclick="toggleCollisions()">Collisions: <span id="collisionStatus">ON</span></button>
        </div>
        
        <div class="control-group">
            <button onclick="applyRandomForce()">Random Push</button>
            <button onclick="toggleTrails()">Trails: <span id="trailStatus">ON</span></button>
        </div>
    </div>

    <div class="physics-info">
        <div><strong>Elements:</strong> <span id="elementCount">0</span></div>
        <div><strong>FPS:</strong> <span id="fpsCounter">60</span></div>
        <div><strong>Physics:</strong> Active</div>
        <div><strong>Collisions:</strong> <span id="collisionCount">0</span></div>
    </div>

    <script>
        class MicrogravitySimulator {
            constructor() {
                this.elements = [];
                this.gravity = 0;
                this.damping = 0.98;
                this.collisionsEnabled = true;
                this.trailsEnabled = true;
                this.collisionCount = 0;
                this.lastFrameTime = performance.now();
                this.fps = 60;
                this.frameCount = 0;
                
                this.isDragging = false;
                this.dragElement = null;
                this.dragOffset = { x: 0, y: 0 };
                this.lastMousePos = { x: 0, y: 0 };
                
                this.init();
                this.createInitialElements();
                this.animate();
            }

            init() {
                document.addEventListener('mousedown', this.onMouseDown.bind(this));
                document.addEventListener('mousemove', this.onMouseMove.bind(this));
                document.addEventListener('mouseup', this.onMouseUp.bind(this));
                
                // Prevent context menu on right click
                document.addEventListener('contextmenu', e => e.preventDefault());
                
                // Keyboard controls
                document.addEventListener('keydown', this.onKeyDown.bind(this));
                
                // Control panel event listeners
                document.getElementById('gravitySlider').addEventListener('input', (e) => {
                    this.gravity = parseFloat(e.target.value) / 100000;
                    document.getElementById('gravityValue').textContent = e.target.value;
                });
                
                document.getElementById('dampingSlider').addEventListener('input', (e) => {
                    this.damping = parseFloat(e.target.value);
                    document.getElementById('dampingValue').textContent = e.target.value;
                });
            }

            createInitialElements() {
                // Create diverse UI elements
                this.createElement('card', 'Mission Control', 'Real-time spacecraft monitoring and navigation systems for deep space exploration.');
                this.createElement('button', 'Launch Sequence', null, 'info');
                this.createElement('button', 'Emergency Stop', null, 'danger');
                this.createElement('toggle', 'Auto Pilot', null);
                this.createElement('input', 'Coordinates', null);
                this.createElement('card', 'System Status', 'All systems nominal. Oxygen levels: 98%. Fuel remaining: 67%. Navigation: Online.');
                this.createElement('button', 'Deploy Solar Panels', null, 'warning');
                this.createElement('toggle', 'Life Support', null);
            }

            createElement(type, title, content = null, variant = null) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                element.innerHTML = `<div class="element-info">Vel: 0.0 | Mass: ${Math.random().toFixed(1)}</div>`;
                
                let innerContent = '';
                
                switch(type) {
                    case 'card':
                        element.classList.add('ui-card');
                        innerContent = `<h3>${title}</h3><p>${content}</p>`;
                        break;
                    case 'button':
                        element.classList.add('ui-button');
                        if (variant) element.classList.add(variant);
                        innerContent = title;
                        element.addEventListener('click', () => this.handleButtonClick(title));
                        break;
                    case 'toggle':
                        element.classList.add('ui-toggle');
                        const isActive = Math.random() > 0.5;
                        innerContent = `
                            <span>${title}</span>
                            <div class="toggle-switch ${isActive ? 'active' : ''}" onclick="this.classList.toggle('active')">
                                <div class="toggle-slider"></div>
                            </div>
                        `;
                        break;
                    case 'input':
                        element.classList.add('ui-input');
                        innerContent = `
                            <label>${title}:</label>
                            <input type="text" placeholder="Enter ${title.toLowerCase()}...">
                        `;
                        break;
                }
                
                element.innerHTML = `<div class="element-info">Vel: 0.0 | Mass: ${Math.random().toFixed(1)}</div>` + innerContent;
                
                // Random position
                const x = Math.random() * (window.innerWidth - 300) + 150;
                const y = Math.random() * (window.innerHeight - 200) + 100;
                
                element.style.left = x + 'px';
                element.style.top = y + 'px';
                
                document.body.appendChild(element);
                
                // Physics properties
                const physicsData = {
                    element: element,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    mass: 0.5 + Math.random() * 1.5,
                    width: element.offsetWidth,
                    height: element.offsetHeight,
                    rotation: 0,
                    rotationVel: 0,
                    trail: []
                };
                
                this.elements.push(physicsData);
                this.updateElementCount();
            }

            handleButtonClick(buttonName) {
                console.log(`Button clicked: ${buttonName}`);
                // Add visual feedback
                const messages = [
                    'Systems initialized...',
                    'Command executed successfully',
                    'Warning: Check fuel levels',
                    'Navigation updated',
                    'Emergency protocols activated'
                ];
                const message = messages[Math.floor(Math.random() * messages.length)];
                this.showNotification(message);
            }

            showNotification(message) {
                const notification = document.createElement('div');
                notification.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: rgba(0, 0, 0, 0.9);
                    color: #64B5F6;
                    padding: 15px 25px;
                    border-radius: 8px;
                    z-index: 1000;
                    font-size: 14px;
                    border: 1px solid rgba(100, 181, 246, 0.5);
                `;
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.style.opacity = '0';
                    notification.style.transition = 'opacity 0.5s ease';
                    setTimeout(() => document.body.removeChild(notification), 500);
                }, 2000);
            }

            onMouseDown(e) {
                if (e.target.closest('.control-panel') || e.target.closest('.physics-info')) return;
                
                const element = e.target.closest('.floating-element');
                if (element) {
                    this.isDragging = true;
                    this.dragElement = this.elements.find(el => el.element === element);
                    
                    const rect = element.getBoundingClientRect();
                    this.dragOffset.x = e.clientX - rect.left;
                    this.dragOffset.y = e.clientY - rect.top;
                    this.lastMousePos.x = e.clientX;
                    this.lastMousePos.y = e.clientY;
                    
                    // Stop current velocity when grabbed
                    this.dragElement.vx = 0;
                    this.dragElement.vy = 0;
                }
            }

            onMouseMove(e) {
                if (this.isDragging && this.dragElement) {
                    const newX = e.clientX - this.dragOffset.x;
                    const newY = e.clientY - this.dragOffset.y;
                    
                    // Calculate velocity based on mouse movement
                    const deltaX = e.clientX - this.lastMousePos.x;
                    const deltaY = e.clientY - this.lastMousePos.y;
                    
                    this.dragElement.x = newX;
                    this.dragElement.y = newY;
                    this.dragElement.vx = deltaX * 0.3;
                    this.dragElement.vy = deltaY * 0.3;
                    
                    this.lastMousePos.x = e.clientX;
                    this.lastMousePos.y = e.clientY;
                }
            }

            onMouseUp(e) {
                if (this.isDragging && this.dragElement) {
                    // Apply release velocity
                    const releaseForce = 0.5;
                    this.dragElement.vx *= releaseForce;
                    this.dragElement.vy *= releaseForce;
                }
                
                this.isDragging = false;
                this.dragElement = null;
            }

            onKeyDown(e) {
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        this.applyRandomForce();
                        break;
                    case 'r':
                        this.resetSimulation();
                        break;
                    case 'c':
                        this.toggleCollisions();
                        break;
                    case 't':
                        this.toggleTrails();
                        break;
                }
            }

            checkCollisions() {
                if (!this.collisionsEnabled) return;
                
                for (let i = 0; i < this.elements.length; i++) {
                    for (let j = i + 1; j < this.elements.length; j++) {
                        const el1 = this.elements[i];
                        const el2 = this.elements[j];
                        
                        const dx = el2.x - el1.x;
                        const dy = el2.y - el1.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        const minDistance = Math.max(el1.width, el1.height) / 2 + Math.max(el2.width, el2.height) / 2;
                        
                        if (distance < minDistance) {
                            this.resolveCollision(el1, el2);
                            this.createCollisionEffect((el1.x + el2.x) / 2, (el1.y + el2.y) / 2);
                            this.collisionCount++;
                        }
                    }
                }
            }

            resolveCollision(el1, el2) {
                const dx = el2.x - el1.x;
                const dy = el2.y - el1.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance === 0) return;
                
                const nx = dx / distance;
                const ny = dy / distance;
                
                // Relative velocity
                const dvx = el2.vx - el1.vx;
                const dvy = el2.vy - el1.vy;
                
                // Relative velocity along normal
                const dvn = dvx * nx + dvy * ny;
                
                if (dvn > 0) return; // Objects separating
                
                // Collision response
                const restitution = 0.8;
                const impulse = 2 * dvn / (el1.mass + el2.mass);
                
                el1.vx += impulse * el2.mass * nx * restitution;
                el1.vy += impulse * el2.mass * ny * restitution;
                el2.vx -= impulse * el1.mass * nx * restitution;
                el2.vy -= impulse * el1.mass * ny * restitution;
                
                // Add some rotation
                el1.rotationVel += (Math.random() - 0.5) * 0.1;
                el2.rotationVel += (Math.random() - 0.5) * 0.1;
                
                // Separate overlapping objects
                const overlap = Math.max(el1.width, el1.height) / 2 + Math.max(el2.width, el2.height) / 2 - distance;
                const separationX = nx * overlap * 0.5;
                const separationY = ny * overlap * 0.5;
                
                el1.x -= separationX;
                el1.y -= separationY;
                el2.x += separationX;
                el2.y += separationY;
            }

            createCollisionEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'collision-effect';
                effect.style.left = (x - 10) + 'px';
                effect.style.top = (y - 10) + 'px';
                effect.style.width = '20px';
                effect.style.height = '20px';
                
                document.body.appendChild(effect);
                
                setTimeout(() => {
                    if (effect.parentNode) {
                        document.body.removeChild(effect);
                    }
                }, 500);
            }

            updatePhysics() {
                this.elements.forEach(element => {
                    if (element === this.dragElement && this.isDragging) {
                        return; // Skip physics for dragged elements
                    }
                    
                    // Apply gravity
                    element.vy += this.gravity;
                    
                    // Update position
                    element.x += element.vx;
                    element.y += element.vy;
                    
                    // Apply damping
                    element.vx *= this.damping;
                    element.vy *= this.damping;
                    element.rotationVel *= this.damping;
                    
                    // Update rotation
                    element.rotation += element.rotationVel;
                    
                    // Boundary collision
                    if (element.x < 0) {
                        element.x = 0;
                        element.vx *= -0.8;
                        element.rotationVel += (Math.random() - 0.5) * 0.1;
                    }
                    if (element.x + element.width > window.innerWidth) {
                        element.x = window.innerWidth - element.width;
                        element.vx *= -0.8;
                        element.rotationVel += (Math.random() - 0.5) * 0.1;
                    }
                    if (element.y < 0) {
                        element.y = 0;
                        element.vy *= -0.8;
                        element.rotationVel += (Math.random() - 0.5) * 0.1;
                    }
                    if (element.y + element.height > window.innerHeight) {
                        element.y = window.innerHeight - element.height;
                        element.vy *= -0.8;
                        element.rotationVel += (Math.random() - 0.5) * 0.1;
                    }
                    
                    // Update trail
                    if (this.trailsEnabled) {
                        element.trail.push({ x: element.x + element.width / 2, y: element.y + element.height / 2 });
                        if (element.trail.length > 20) {
                            element.trail.shift();
                        }
                    }
                    
                    // Update DOM element
                    element.element.style.left = element.x + 'px';
                    element.element.style.top = element.y + 'px';
                    element.element.style.transform = `rotate(${element.rotation}rad)`;
                    
                    // Update element info
                    const velocity = Math.sqrt(element.vx * element.vx + element.vy * element.vy);
                    const info = element.element.querySelector('.element-info');
                    if (info) {
                        info.textContent = `Vel: ${velocity.toFixed(1)} | Mass: ${element.mass.toFixed(1)}`;
                    }
                });
            }

            updateTrails() {
                if (!this.trailsEnabled) return;
                
                // Remove old trails
                document.querySelectorAll('.velocity-trail').forEach(trail => trail.remove());
                
                this.elements.forEach(element => {
                    element.trail.forEach((point, index) => {
                        const trail = document.createElement('div');
                        trail.className = 'velocity-trail';
                        const opacity = (index / element.trail.length) * 0.5;
                        const size = (index / element.trail.length) * 6 + 2;
                        
                        trail.style.left = (point.x - size / 2) + 'px';
                        trail.style.top = (point.y - size / 2) + 'px';
                        trail.style.width = size + 'px';
                        trail.style.height = size + 'px';
                        trail.style.opacity = opacity;
                        
                        document.body.appendChild(trail);
                    });
                });
            }

            updateFPS() {
                const currentTime = performance.now();
                const deltaTime = currentTime - this.lastFrameTime;
                this.fps = Math.round(1000 / deltaTime);
                this.lastFrameTime = currentTime;
                
                this.frameCount++;
                if (this.frameCount % 10 === 0) {
                    document.getElementById('fpsCounter').textContent = this.fps;
                    document.getElementById('collisionCount').textContent = this.collisionCount;
                }
            }

            animate() {
                this.updatePhysics();
                this.checkCollisions();
                this.updateTrails();
                this.updateFPS();
                
                requestAnimationFrame(() => this.animate());
            }

            updateElementCount() {
                document.getElementById('elementCount').textContent = this.elements.length;
            }
        }

        // Global functions for control panel
        let simulator;

        function addRandomElement() {
            const types = ['card', 'button', 'toggle', 'input'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const titles = {
                card: ['Sensor Data', 'Navigation', 'Communications', 'Power Systems'],
                button: ['Activate', 'Shutdown', 'Calibrate', 'Initialize'],
                toggle: ['Autopilot', 'Shields', 'Thrusters', 'Scanner'],
                input: ['Frequency', 'Coordinates', 'Password', 'Command']
            };
            
            const variants = ['info', 'danger', 'warning'];
            const title = titles[type][Math.floor(Math.random() * titles[type].length)];
            const content = type === 'card' ? 'Advanced space operations interface with real-time monitoring capabilities.' : null;
            const variant = type === 'button' ? variants[Math.floor(Math.random() * variants.length)] : null;
            
            simulator.createElement(type, title, content, variant);
        }

        function resetSimulation() {
            simulator.elements.forEach(el => {
                document.body.removeChild(el.element);
            });
            simulator.elements = [];
            simulator.collisionCount = 0;
            document.querySelectorAll('.velocity-trail').forEach(trail => trail.remove());
            document.querySelectorAll('.collision-effect').forEach(effect => effect.remove());
            
            simulator.createInitialElements();
        }

        function toggleCollisions() {
            simulator.collisionsEnabled = !simulator.collisionsEnabled;
            document.getElementById('collisionStatus').textContent = simulator.collisionsEnabled ? 'ON' : 'OFF';
        }

        function toggleTrails() {
            simulator.trailsEnabled = !simulator.trailsEnabled;
            document.getElementById('trailStatus').textContent = simulator.trailsEnabled ? 'ON' : 'OFF';
            
            if (!simulator.trailsEnabled) {
                document.querySelectorAll('.velocity-trail').forEach(trail => trail.remove());
                simulator.elements.forEach(el => el.trail = []);
            }
        }

        function applyRandomForce() {
            simulator.elements.forEach(element => {
                const forceX = (Math.random() - 0.5) * 10;
                const forceY = (Math.random() - 0.5) * 10;
                element.vx += forceX;
                element.vy += forceY;
                element.rotationVel += (Math.random() - 0.5) * 0.2;
                
                // Add spinning effect for dramatic impact
                if (Math.random() > 0.7) {
                    element.element.classList.add('spinning');
                    setTimeout(() => {
                        element.element.classList.remove('spinning');
                    }, 2000);
                }
            });
            
            simulator.showNotification('Random force applied to all elements!');
        }

        // Advanced features
        function createGravityWell(x, y) {
            const well = document.createElement('div');
            well.style.cssText = `
                position: absolute;
                left: ${x - 25}px;
                top: ${y - 25}px;
                width: 50px;
                height: 50px;
                border: 2px solid #ff6b6b;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(255, 107, 107, 0.3), transparent);
                animation: pulse 2s ease-in-out infinite;
                pointer-events: none;
                z-index: 5;
            `;
            
            document.body.appendChild(well);
            
            // Apply gravitational force to nearby elements
            const applyGravity = () => {
                simulator.elements.forEach(element => {
                    const dx = x - (element.x + element.width / 2);
                    const dy = y - (element.y + element.height / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 200 && distance > 0) {
                        const force = 100 / (distance * distance);
                        element.vx += (dx / distance) * force * 0.01;
                        element.vy += (dy / distance) * force * 0.01;
                    }
                });
            };
            
            const gravityInterval = setInterval(applyGravity, 16);
            
            setTimeout(() => {
                clearInterval(gravityInterval);
                if (well.parentNode) {
                    document.body.removeChild(well);
                }
            }, 5000);
        }

        // Double-click to create gravity wells
        document.addEventListener('dblclick', (e) => {
            if (!e.target.closest('.control-panel') && !e.target.closest('.physics-info')) {
                createGravityWell(e.clientX, e.clientY);
                simulator.showNotification('Gravity well created!');
            }
        });

        // Add CSS for pulse animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0%, 100% { transform: scale(1); opacity: 0.7; }
                50% { transform: scale(1.2); opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Initialize the simulator
        document.addEventListener('DOMContentLoaded', () => {
            simulator = new MicrogravitySimulator();
            
            // Add welcome message
            setTimeout(() => {
                simulator.showNotification('🚀 Welcome to Microgravity UI! Drag elements, use spacebar for random force, double-click for gravity wells!');
            }, 1000);
        });

        // Performance optimization
        let isVisible = true;
        document.addEventListener('visibilitychange', () => {
            isVisible = !document.hidden;
            if (isVisible) {
                simulator.lastFrameTime = performance.now();
            }
        });

        // Responsive handling
        window.addEventListener('resize', () => {
            simulator.elements.forEach(element => {
                // Keep elements within new bounds
                element.x = Math.min(element.x, window.innerWidth - element.width);
                element.y = Math.min(element.y, window.innerHeight - element.height);
            });
        });

        // Particle system for enhanced effects
        class ParticleSystem {
            constructor() {
                this.particles = [];
            }
            
            createExplosion(x, y, color = '#ff6b6b') {
                for (let i = 0; i < 20; i++) {
                    const particle = {
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        decay: 0.02,
                        color: color,
                        size: Math.random() * 4 + 2
                    };
                    this.particles.push(particle);
                }
            }
            
            update() {
                this.particles = this.particles.filter(particle => {
                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                    particle.life -= particle.decay;
                    
                    return particle.life > 0;
                });
            }
            
            render() {
                // Remove old particle elements
                document.querySelectorAll('.particle').forEach(p => p.remove());
                
                this.particles.forEach(particle => {
                    const element = document.createElement('div');
                    element.className = 'particle';
                    element.style.cssText = `
                        position: absolute;
                        left: ${particle.x}px;
                        top: ${particle.y}px;
                        width: ${particle.size}px;
                        height: ${particle.size}px;
                        background: ${particle.color};
                        border-radius: 50%;
                        opacity: ${particle.life};
                        pointer-events: none;
                        z-index: 20;
                    `;
                    document.body.appendChild(element);
                });
            }
        }

        // Initialize particle system
        const particleSystem = new ParticleSystem();
        
        // Enhanced collision effects with particles
        const originalCreateCollisionEffect = simulator?.createCollisionEffect;
        if (simulator) {
            simulator.createCollisionEffect = function(x, y) {
                originalCreateCollisionEffect.call(this, x, y);
                particleSystem.createExplosion(x, y, '#64B5F6');
            };
        }

        // Particle system animation loop
        function animateParticles() {
            if (isVisible) {
                particleSystem.update();
                particleSystem.render();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
