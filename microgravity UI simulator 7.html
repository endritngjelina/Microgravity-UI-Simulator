<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgravity UI Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 30%, #0f0f23 70%, #000000 100%);
            font-family: 'Segoe UI', 'Arial', sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Animated gradient overlay */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(45deg, 
                rgba(100, 255, 218, 0.02) 0%, 
                transparent 25%, 
                rgba(102, 126, 234, 0.02) 50%, 
                transparent 75%,
                rgba(255, 107, 107, 0.02) 100%);
            animation: gradientShift 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 0.3; transform: rotate(0deg) scale(1); }
            25% { opacity: 0.5; transform: rotate(90deg) scale(1.1); }
            50% { opacity: 0.4; transform: rotate(180deg) scale(0.9); }
            75% { opacity: 0.6; transform: rotate(270deg) scale(1.05); }
        }

        /* Starfield background */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .control-panel {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: linear-gradient(135deg, 
                rgba(13, 13, 35, 0.98) 0%,
                rgba(30, 30, 60, 0.95) 50%,
                rgba(13, 13, 35, 0.98) 100%);
            backdrop-filter: blur(25px) saturate(180%) contrast(120%);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 25px;
            padding: 30px;
            color: white;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.8),
                0 10px 30px rgba(100, 255, 218, 0.1),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            transform: translateZ(0);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            animation: floatIn 1.2s ease-out;
            position: relative;
            overflow: hidden;
        }

        .control-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(100, 255, 218, 0.1) 50%, 
                transparent 100%);
            animation: panelScan 4s ease-in-out infinite;
        }

        @keyframes panelScan {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .control-panel:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 
                0 35px 100px rgba(0, 0, 0, 0.9),
                0 15px 40px rgba(100, 255, 218, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(100, 255, 218, 0.3);
        }

        @keyframes floatIn {
            0% { 
                opacity: 0; 
                transform: translateY(-30px) scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .control-panel h3 {
            margin-bottom: 20px;
            color: #64ffda;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
            letter-spacing: 0.5px;
            position: relative;
        }

        .control-panel h3:after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #64ffda, transparent);
            border-radius: 1px;
        }

        .control-group {
            margin-bottom: 20px;
            position: relative;
            padding: 15px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01));
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .control-group:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.03));
            border-color: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #e0e0e0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .slider {
            width: 160px;
            height: 6px;
            background: linear-gradient(90deg, #1a1a2e, #2d2d4a);
            outline: none;
            border-radius: 20px;
            -webkit-appearance: none;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .slider:hover {
            background: linear-gradient(90deg, #2d2d4a, #404070);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(100, 255, 218, 0.2);
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #64ffda, #4ecdc4);
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 
                0 4px 12px rgba(100, 255, 218, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            position: relative;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: linear-gradient(135deg, #4ecdc4, #64ffda);
            box-shadow: 
                0 6px 20px rgba(100, 255, 218, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .slider::-webkit-slider-thumb:active {
            transform: scale(1.1);
        }

        /* Advanced button system with micro-interactions */
        .button-control {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 14px 24px;
            margin: 10px 6px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 6px 20px rgba(102, 126, 234, 0.4),
                0 2px 8px rgba(0, 0, 0, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            will-change: transform, box-shadow;
        }

        .button-control::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.3) 25%,
                rgba(255, 255, 255, 0.4) 50%,
                rgba(255, 255, 255, 0.3) 75%,
                transparent 100%);
            transition: left 0.8s cubic-bezier(0.23, 1, 0.32, 1);
            transform: skewX(-20deg);
        }

        .button-control::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }

        .button-control:hover {
            transform: translateY(-4px) scale(1.08);
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            box-shadow: 
                0 12px 35px rgba(102, 126, 234, 0.6),
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
        }

        .button-control:hover::before {
            left: 150%;
        }

        .button-control:hover::after {
            width: 80px;
            height: 80px;
        }

        .button-control:active {
            transform: translateY(-2px) scale(1.05);
            transition: all 0.1s ease;
        }

        /* Special button variants */
        .button-control.primary {
            background: linear-gradient(135deg, #64ffda 0%, #4ecdc4 100%);
            color: #1a1a2e;
            font-weight: 800;
        }

        .button-control.primary:hover {
            background: linear-gradient(135deg, #4ecdc4 0%, #64ffda 100%);
            box-shadow: 
                0 12px 35px rgba(100, 255, 218, 0.6),
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.4);
        }

        .button-control.danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }

        .button-control.danger:hover {
            background: linear-gradient(135deg, #ee5a52 0%, #ff6b6b 100%);
            box-shadow: 
                0 12px 35px rgba(255, 107, 107, 0.6),
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .floating-element {
            position: absolute;
            cursor: grab;
            user-select: none;
            border-radius: 25px;
            backdrop-filter: blur(25px) saturate(160%) contrast(110%);
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 15px 50px rgba(0, 0, 0, 0.5),
                0 5px 15px rgba(0, 0, 0, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            will-change: transform, box-shadow;
        }

        .floating-element::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(255, 255, 255, 0.4) 30%, 
                rgba(100, 255, 218, 0.6) 50%,
                rgba(255, 255, 255, 0.4) 70%,
                transparent 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .floating-element::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(100, 255, 218, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.4s ease;
            pointer-events: none;
        }

        .floating-element:hover {
            transform: scale(1.1) translateY(-8px) rotateX(5deg);
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 10px 30px rgba(0, 0, 0, 0.4),
                0 0 50px rgba(100, 255, 218, 0.3),
                inset 0 2px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            border-color: rgba(100, 255, 218, 0.4);
            filter: brightness(1.1) contrast(1.05);
        }

        .floating-element:hover::before {
            opacity: 1;
        }

        .floating-element:hover::after {
            width: 100px;
            height: 100px;
        }

        .floating-element:active {
            cursor: grabbing;
            transform: scale(1.05) rotateX(2deg);
        }

        .floating-element.dragging {
            z-index: 100;
            transform: scale(1.2) rotate(12deg) rotateX(10deg);
            box-shadow: 
                0 40px 120px rgba(0, 0, 0, 0.8),
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 80px rgba(100, 255, 218, 0.5),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3);
            border-color: rgba(100, 255, 218, 0.6);
            filter: brightness(1.3) contrast(1.1) saturate(1.2);
        }

        .floating-element.dragging::before {
            opacity: 1;
            animation: dragGlow 0.5s ease-in-out infinite alternate;
        }

        @keyframes dragGlow {
            0% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .card {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.05) 100%);
            padding: 30px;
            width: 300px;
            min-height: 180px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .card:before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, 
                rgba(100, 255, 218, 0.1) 0%, 
                transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover:before {
            opacity: 1;
        }

        .card h3 {
            margin-bottom: 18px;
            color: #64ffda;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            position: relative;
            z-index: 1;
        }

        .card p {
            line-height: 1.7;
            opacity: 0.95;
            font-size: 15px;
            position: relative;
            z-index: 1;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 35px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            min-width: 160px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(102, 126, 234, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .button:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s;
        }

        .button:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
            transform: translateY(-5px) scale(1.05);
            box-shadow: 
                0 15px 35px rgba(102, 126, 234, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .button:hover:before {
            left: 100%;
        }

        .button:active {
            transform: translateY(-2px) scale(1.02);
        }

        .circular-button {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            color: white;
            border: none;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 10px 30px rgba(255, 107, 107, 0.4),
                inset 0 2px 0 rgba(255, 255, 255, 0.2);
        }

        .circular-button:before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            transform: scale(0);
            transition: transform 0.5s ease;
        }

        .circular-button:hover {
            background: linear-gradient(135deg, #ee5a52 0%, #ff6b6b 100%);
            transform: scale(1.15) rotate(10deg);
            box-shadow: 
                0 15px 40px rgba(255, 107, 107, 0.6),
                inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .circular-button:hover:before {
            transform: scale(1);
        }

        .circular-button:active {
            transform: scale(1.08) rotate(5deg);
        }

        .notification {
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.2) 0%, rgba(100, 255, 218, 0.1) 100%);
            border: 1px solid rgba(100, 255, 218, 0.3);
            padding: 20px;
            width: 300px;
            color: white;
        }

        .notification .title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #64ffda;
        }

        .slider-element {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
            padding: 20px;
            width: 250px;
            height: 80px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: white;
        }

        .mini-slider {
            flex: 1;
            height: 5px;
            background: #333;
            border-radius: 5px;
            -webkit-appearance: none;
            outline: none;
        }

        .mini-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: #64ffda;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Advanced physics info panel */
        .physics-info {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, 
                rgba(13, 13, 35, 0.98) 0%,
                rgba(30, 30, 60, 0.95) 50%,
                rgba(13, 13, 35, 0.98) 100%);
            backdrop-filter: blur(25px) saturate(180%) contrast(120%);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-radius: 25px;
            padding: 25px;
            color: white;
            font-size: 14px;
            max-width: 280px;
            min-width: 240px;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.8),
                0 10px 30px rgba(100, 255, 218, 0.1),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            animation: slideInRight 1.2s ease-out 0.8s both;
            position: relative;
            overflow: hidden;
        }

        .physics-info::before {
            content: '';
            position: absolute;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(270deg, 
                transparent 0%, 
                rgba(100, 255, 218, 0.1) 50%, 
                transparent 100%);
            animation: infoPanelScan 5s ease-in-out infinite;
        }

        @keyframes infoPanelScan {
            0%, 100% { right: -100%; }
            50% { right: 100%; }
        }

        .physics-info:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 
                0 35px 100px rgba(0, 0, 0, 0.9),
                0 15px 40px rgba(100, 255, 218, 0.2),
                inset 0 2px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(100, 255, 218, 0.3);
        }

        .physics-info .stat-row {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.05) 0%, 
                rgba(255, 255, 255, 0.02) 100%);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .physics-info .stat-row:last-child {
            margin-bottom: 0;
        }

        .physics-info .stat-row:hover {
            background: linear-gradient(135deg, 
                rgba(100, 255, 218, 0.1) 0%, 
                rgba(100, 255, 218, 0.05) 100%);
            border-color: rgba(100, 255, 218, 0.2);
            transform: translateX(5px);
        }

        .physics-info .stat-row::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, #64ffda, #4ecdc4);
            border-radius: 0 2px 2px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .physics-info .stat-row:hover::before {
            opacity: 1;
        }

        .physics-info strong {
            color: #64ffda;
            text-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
            font-weight: 700;
            position: relative;
            z-index: 1;
        }

        .physics-info .stat-value {
            color: #ffffff;
            font-weight: 600;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: linear-gradient(135deg, #64ffda, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        @keyframes slideInRight {
            0% { 
                opacity: 0; 
                transform: translateX(30px) scale(0.9); 
            }
            100% { 
                opacity: 1; 
                transform: translateX(0) scale(1); 
            }
        }

        /* Advanced trail system with multiple particle types */
        .trail {
            position: absolute;
            width: 5px;
            height: 5px;
            background: radial-gradient(circle, 
                rgba(100, 255, 218, 0.9) 0%, 
                rgba(100, 255, 218, 0.6) 30%,
                rgba(100, 255, 218, 0.3) 60%, 
                transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: fadeTrailAdvanced 2s ease-out forwards;
            box-shadow: 
                0 0 10px rgba(100, 255, 218, 0.8),
                0 0 20px rgba(100, 255, 218, 0.4);
        }

        .trail.spark {
            width: 3px;
            height: 3px;
            background: radial-gradient(circle, 
                rgba(255, 255, 255, 0.9) 0%, 
                rgba(100, 255, 218, 0.7) 50%,
                transparent 100%);
            animation: sparkTrail 1.5s ease-out forwards;
        }

        .trail.energy {
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, 
                rgba(102, 126, 234, 0.8) 0%, 
                rgba(100, 255, 218, 0.5) 40%,
                transparent 100%);
            animation: energyTrail 2.5s ease-out forwards;
        }

        @keyframes fadeTrailAdvanced {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            25% {
                opacity: 0.8;
                transform: scale(1.3) rotate(90deg);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.5) rotate(180deg);
            }
            75% {
                opacity: 0.3;
                transform: scale(1.2) rotate(270deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.1) rotate(360deg);
            }
        }

        @keyframes sparkTrail {
            0% {
                opacity: 1;
                transform: scale(1);
                filter: brightness(2);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.4);
                filter: brightness(1.5);
            }
            100% {
                opacity: 0;
                transform: scale(0.2);
                filter: brightness(0.5);
            }
        }

        @keyframes energyTrail {
            0% {
                opacity: 1;
                transform: scale(1);
                filter: hue-rotate(0deg);
            }
            33% {
                opacity: 0.8;
                transform: scale(1.6);
                filter: hue-rotate(120deg);
            }
            66% {
                opacity: 0.5;
                transform: scale(1.3);
                filter: hue-rotate(240deg);
            }
            100% {
                opacity: 0;
                transform: scale(0.1);
                filter: hue-rotate(360deg);
            }
        }

        /* Enhanced collision effects with multiple rings */
        .collision-effect {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            animation: collisionPulseAdvanced 1s ease-out forwards;
        }

        .collision-effect::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 4px solid #64ffda;
            border-radius: 50%;
            animation: ringExpand 1s ease-out forwards;
            box-shadow: 
                0 0 20px rgba(100, 255, 218, 0.8),
                inset 0 0 10px rgba(100, 255, 218, 0.4);
        }

        .collision-effect::after {
            content: '';
            position: absolute;
            top: 25%;
            left: 25%;
            width: 50%;
            height: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: innerRingExpand 1s ease-out 0.1s forwards;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        @keyframes collisionPulseAdvanced {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
                filter: brightness(2) hue-rotate(0deg);
            }
            25% {
                transform: scale(1.5) rotate(90deg);
                opacity: 0.9;
                filter: brightness(1.8) hue-rotate(60deg);
            }
            50% {
                transform: scale(3) rotate(180deg);
                opacity: 0.7;
                filter: brightness(1.5) hue-rotate(120deg);
            }
            75% {
                transform: scale(4.5) rotate(270deg);
                opacity: 0.4;
                filter: brightness(1.2) hue-rotate(180deg);
            }
            100% {
                transform: scale(6) rotate(360deg);
                opacity: 0;
                filter: brightness(1) hue-rotate(240deg);
            }
        }

        @keyframes ringExpand {
            0% {
                transform: scale(0);
                border-width: 4px;
                opacity: 1;
            }
            50% {
                transform: scale(2);
                border-width: 3px;
                opacity: 0.8;
            }
            100% {
                transform: scale(4);
                border-width: 1px;
                opacity: 0;
            }
        }

        @keyframes innerRingExpand {
            0% {
                transform: scale(0);
                border-width: 2px;
                opacity: 1;
            }
            60% {
                transform: scale(3);
                border-width: 1px;
                opacity: 0.6;
            }
            100% {
                transform: scale(5);
                border-width: 0px;
                opacity: 0;
            }
        }

        .floating-element.bouncing {
            animation: bounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0%, 100% { 
                transform: scale(1) rotate(0deg); 
                filter: brightness(1);
            }
            25% { 
                transform: scale(1.15) rotate(5deg); 
                filter: brightness(1.3);
            }
            50% { 
                transform: scale(1.2) rotate(-3deg); 
                filter: brightness(1.4);
            }
            75% { 
                transform: scale(1.1) rotate(2deg); 
                filter: brightness(1.2);
            }
        }

        /* Enhanced notification styling */
        .notification {
            background: linear-gradient(135deg, 
                rgba(100, 255, 218, 0.15) 0%, 
                rgba(100, 255, 218, 0.08) 50%,
                rgba(100, 255, 218, 0.05) 100%);
            border: 2px solid rgba(100, 255, 218, 0.3);
            padding: 25px;
            width: 320px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .notification:before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #64ffda, transparent);
            animation: notificationScan 3s ease-in-out infinite;
        }

        @keyframes notificationScan {
            0%, 100% { left: -100%; }
            50% { left: 100%; }
        }

        .notification .title {
            font-weight: 700;
            margin-bottom: 12px;
            color: #64ffda;
            font-size: 16px;
            text-shadow: 0 0 15px rgba(100, 255, 218, 0.4);
            position: relative;
            z-index: 1;
        }

        .notification div:last-child {
            position: relative;
            z-index: 1;
            line-height: 1.6;
        }

        /* Enhanced slider element */
        .slider-element {
            background: linear-gradient(135deg, 
                rgba(255, 255, 255, 0.12) 0%, 
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.05) 100%);
            padding: 25px;
            width: 270px;
            height: 90px;
            display: flex;
            align-items: center;
            gap: 20px;
            color: white;
            position: relative;
        }

        .slider-element span {
            font-weight: 600;
            color: #e0e0e0;
            min-width: 60px;
            font-size: 14px;
        }

        .mini-slider {
            flex: 1;
            height: 6px;
            background: linear-gradient(90deg, #1a1a2e, #2d2d4a);
            border-radius: 20px;
            -webkit-appearance: none;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .mini-slider:hover {
            background: linear-gradient(90deg, #2d2d4a, #404070);
            box-shadow: 
                inset 0 2px 4px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(100, 255, 218, 0.2);
        }

        .mini-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: linear-gradient(135deg, #64ffda, #4ecdc4);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 
                0 3px 8px rgba(100, 255, 218, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .mini-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 
                0 4px 12px rgba(100, 255, 218, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        /* Pulse animation for active elements */
        @keyframes elementPulse {
            0%, 100% { 
                box-shadow: 
                    0 12px 40px rgba(0, 0, 0, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
            50% { 
                box-shadow: 
                    0 12px 40px rgba(0, 0, 0, 0.4),
                    0 0 30px rgba(100, 255, 218, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
        }

        .floating-element.active {
            animation: elementPulse 2s ease-in-out infinite;
        }

        /* Loading animation for new elements */
        @keyframes elementSpawn {
            0% {
                opacity: 0;
                transform: scale(0) rotate(180deg);
                filter: blur(10px);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.2) rotate(90deg);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0px);
            }
        }

        .floating-element.spawning {
            animation: elementSpawn 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Enhanced starfield with parallax layers */
        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                /* Layer 1 - Large bright stars */
                radial-gradient(3px 3px at 50px 100px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 200px 50px, rgba(100,255,218,0.8), transparent),
                radial-gradient(3px 3px at 350px 200px, rgba(255,255,255,0.85), transparent),
                /* Layer 2 - Medium stars */
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.7), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(100,255,218,0.6), transparent),
                radial-gradient(1px 1px at 90px 40px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(102,126,234,0.5), transparent),
                /* Layer 3 - Small distant stars */
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 200px 60px, rgba(100,255,218,0.3), transparent),
                radial-gradient(1px 1px at 300px 120px, rgba(255,107,107,0.3), transparent),
                radial-gradient(1px 1px at 400px 90px, rgba(255,255,255,0.3), transparent);
            background-repeat: repeat;
            background-size: 300px 150px, 400px 200px, 250px 120px;
            animation: twinkleComplex 8s ease-in-out infinite alternate;
        }

        @keyframes twinkleComplex {
            0% { 
                opacity: 0.7; 
                transform: scale(1) rotate(0deg);
            }
            25% {
                opacity: 0.9;
                transform: scale(1.01) rotate(0.5deg);
            }
            50% {
                opacity: 0.85;
                transform: scale(1.02) rotate(1deg);
            }
            75% {
                opacity: 0.95;
                transform: scale(1.01) rotate(0.5deg);
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg);
            }
        }
        .floating-element.bouncing {
            animation: bounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounce {
            0%, 100% { 
                transform: scale(1) rotate(0deg); 
                filter: brightness(1);
            }
            25% { 
                transform: scale(1.15) rotate(5deg); 
                filter: brightness(1.3);
            }
            50% { 
                transform: scale(1.2) rotate(-3deg); 
                filter: brightness(1.4);
            }
            75% { 
                transform: scale(1.1) rotate(2deg); 
            }
        }
    </style>
</head>
<body>
    <div class="starfield"></div>
    
    <div class="control-panel">
        <h3>🚀 Microgravity Controls</h3>
        
        <div class="control-group">
            <label>Gravity Strength</label>
            <input type="range" class="slider" id="gravitySlider" min="0" max="2" step="0.1" value="0.3">
        </div>
        
        <div class="control-group">
            <label>Air Resistance</label>
            <input type="range" class="slider" id="frictionSlider" min="0.9" max="1" step="0.01" value="0.995">
        </div>
        
        <div class="control-group">
            <label>Bounce Factor</label>
            <input type="range" class="slider" id="bounceSlider" min="0.3" max="0.9" step="0.1" value="0.7">
        </div>
        
        <button class="button-control primary" onclick="addRandomElement()">Add Element</button>
        <button class="button-control danger" onclick="resetSimulation()">Reset</button>
        <button class="button-control" onclick="toggleTrails()">Toggle Trails</button>
        <button class="button-control" onclick="applyGravityWave()">Gravity Wave</button>
    </div>

    <div class="physics-info">
        <div class="stat-row">
            <strong>Active Elements:</strong> 
            <span class="stat-value" id="elementCount">0</span>
        </div>
        <div class="stat-row">
            <strong>Total Collisions:</strong> 
            <span class="stat-value" id="collisionCount">0</span>
        </div>
        <div class="stat-row">
            <strong>Average Velocity:</strong> 
            <span class="stat-value" id="avgVelocity">0</span> px/s
        </div>
        <div class="stat-row">
            <strong>System Energy:</strong> 
            <span class="stat-value" id="systemEnergy">0</span>%
        </div>
    </div>

    <script>
        class MicrogravitySimulator {
            constructor() {
                this.elements = [];
                this.gravity = 0.3;
                this.friction = 0.995;
                this.bounceFactor = 0.7;
                this.collisionCount = 0;
                this.showTrails = true;
                this.isDragging = false;
                this.dragElement = null;
                this.dragOffset = { x: 0, y: 0 };
                this.lastMousePos = { x: 0, y: 0 };
                this.mouseVelocity = { x: 0, y: 0 };
                
                this.initializeControls();
                this.createInitialElements();
                this.startPhysicsLoop();
                this.bindEvents();
            }

            initializeControls() {
                document.getElementById('gravitySlider').addEventListener('input', (e) => {
                    this.gravity = parseFloat(e.target.value);
                });
                
                document.getElementById('frictionSlider').addEventListener('input', (e) => {
                    this.friction = parseFloat(e.target.value);
                });
                
                document.getElementById('bounceSlider').addEventListener('input', (e) => {
                    this.bounceFactor = parseFloat(e.target.value);
                });
            }

            createInitialElements() {
                // Create diverse initial elements
                this.createElement('card', 200, 150, `
                    <h3>Space Navigation</h3>
                    <p>Navigate through zero gravity with intuitive controls and realistic physics simulation.</p>
                `);
                
                this.createElement('button', 600, 200, 'Launch Mission');
                this.createElement('circular-button', 800, 300, '🚀');
                
                this.createElement('notification', 300, 400, `
                    <div class="title">System Alert</div>
                    <div>Microgravity environment active. All UI elements are now floating freely.</div>
                `);
                
                this.createElement('card', 700, 500, `
                    <h3>Physics Engine</h3>
                    <p>Advanced collision detection, momentum conservation, and realistic orbital mechanics.</p>
                `);
                
                this.createElement('slider-element', 150, 600, `
                    <span>Volume</span>
                    <input type="range" class="mini-slider" min="0" max="100" value="75">
                `);
                
                this.createElement('button', 900, 150, 'Data Analysis');
                this.createElement('circular-button', 400, 250, '⚙️');
            }

            createElement(type, x, y, content) {
                const element = document.createElement('div');
                element.className = `floating-element ${type} spawning`;
                element.innerHTML = content;
                element.style.left = x + 'px';
                element.style.top = y + 'px';
                
                const physics = {
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    mass: type === 'card' ? 2 : 1,
                    width: 0,
                    height: 0,
                    rotation: 0,
                    angularVelocity: (Math.random() - 0.5) * 0.02
                };
                
                document.body.appendChild(element);
                
                // Remove spawning animation after completion
                setTimeout(() => {
                    element.classList.remove('spawning');
                }, 800);
                
                // Get actual dimensions after adding to DOM
                setTimeout(() => {
                    const rect = element.getBoundingClientRect();
                    physics.width = rect.width;
                    physics.height = rect.height;
                }, 0);
                
                this.elements.push({ element, physics, type });
                this.updateElementCount();
            }

            bindEvents() {
                document.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                document.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                document.addEventListener('mouseup', (e) => this.handleMouseUp(e));
                document.addEventListener('keydown', (e) => this.handleKeyDown(e));
            }

            handleMouseDown(e) {
                const clickedElement = e.target.closest('.floating-element');
                if (clickedElement) {
                    this.isDragging = true;
                    this.dragElement = this.elements.find(el => el.element === clickedElement);
                    
                    if (this.dragElement) {
                        const rect = clickedElement.getBoundingClientRect();
                        this.dragOffset.x = e.clientX - rect.left;
                        this.dragOffset.y = e.clientY - rect.top;
                        
                        clickedElement.classList.add('dragging');
                        this.lastMousePos = { x: e.clientX, y: e.clientY };
                        this.mouseVelocity = { x: 0, y: 0 };
                    }
                }
            }

            handleMouseMove(e) {
                if (this.isDragging && this.dragElement) {
                    const deltaX = e.clientX - this.lastMousePos.x;
                    const deltaY = e.clientY - this.lastMousePos.y;
                    
                    this.mouseVelocity.x = deltaX * 0.5;
                    this.mouseVelocity.y = deltaY * 0.5;
                    
                    this.dragElement.physics.x = e.clientX - this.dragOffset.x;
                    this.dragElement.physics.y = e.clientY - this.dragOffset.y;
                    
                    this.updateElementPosition(this.dragElement);
                    
                    if (this.showTrails) {
                        this.createTrail(e.clientX, e.clientY);
                    }
                    
                    this.lastMousePos = { x: e.clientX, y: e.clientY };
                }
            }

            handleMouseUp(e) {
                if (this.isDragging && this.dragElement) {
                    this.dragElement.element.classList.remove('dragging');
                    
                    // Apply release velocity
                    this.dragElement.physics.vx = this.mouseVelocity.x * 0.3;
                    this.dragElement.physics.vy = this.mouseVelocity.y * 0.3;
                    this.dragElement.physics.angularVelocity = (Math.random() - 0.5) * 0.1;
                    
                    this.isDragging = false;
                    this.dragElement = null;
                }
            }

            handleKeyDown(e) {
                switch(e.key) {
                    case ' ':
                        e.preventDefault();
                        this.applyRandomForces();
                        break;
                    case 'r':
                        this.resetSimulation();
                        break;
                    case 'a':
                        addRandomElement();
                        break;
                }
            }

            applyRandomForces() {
                this.elements.forEach(el => {
                    el.physics.vx += (Math.random() - 0.5) * 10;
                    el.physics.vy += (Math.random() - 0.5) * 10;
                    el.physics.angularVelocity += (Math.random() - 0.5) * 0.2;
                });
            }

            updatePhysics() {
                this.elements.forEach(el => {
                    if (this.isDragging && el === this.dragElement) return;
                    
                    // Apply gravity
                    el.physics.vy += this.gravity;
                    
                    // Apply friction
                    el.physics.vx *= this.friction;
                    el.physics.vy *= this.friction;
                    el.physics.angularVelocity *= this.friction;
                    
                    // Update position
                    el.physics.x += el.physics.vx;
                    el.physics.y += el.physics.vy;
                    el.physics.rotation += el.physics.angularVelocity;
                    
                    // Boundary collisions
                    this.handleBoundaryCollisions(el);
                    
                    this.updateElementPosition(el);
                    
                    // Create trails
                    if (this.showTrails && (Math.abs(el.physics.vx) > 1 || Math.abs(el.physics.vy) > 1)) {
                        this.createTrail(el.physics.x + el.physics.width/2, el.physics.y + el.physics.height/2);
                    }
                });
                
                // Check element collisions
                this.checkCollisions();
                this.updateStats();
            }

            handleBoundaryCollisions(el) {
                const margin = 50;
                
                if (el.physics.x < 0) {
                    el.physics.x = 0;
                    el.physics.vx = Math.abs(el.physics.vx) * this.bounceFactor;
                    this.createCollisionEffect(el.physics.x, el.physics.y);
                    el.element.classList.add('bouncing');
                    setTimeout(() => el.element.classList.remove('bouncing'), 300);
                }
                
                if (el.physics.x + el.physics.width > window.innerWidth) {
                    el.physics.x = window.innerWidth - el.physics.width;
                    el.physics.vx = -Math.abs(el.physics.vx) * this.bounceFactor;
                    this.createCollisionEffect(el.physics.x + el.physics.width, el.physics.y);
                    el.element.classList.add('bouncing');
                    setTimeout(() => el.element.classList.remove('bouncing'), 300);
                }
                
                if (el.physics.y < 0) {
                    el.physics.y = 0;
                    el.physics.vy = Math.abs(el.physics.vy) * this.bounceFactor;
                    this.createCollisionEffect(el.physics.x, el.physics.y);
                    el.element.classList.add('bouncing');
                    setTimeout(() => el.element.classList.remove('bouncing'), 300);
                }
                
                if (el.physics.y + el.physics.height > window.innerHeight - margin) {
                    el.physics.y = window.innerHeight - el.physics.height - margin;
                    el.physics.vy = -Math.abs(el.physics.vy) * this.bounceFactor;
                    this.createCollisionEffect(el.physics.x, el.physics.y + el.physics.height);
                    el.element.classList.add('bouncing');
                    setTimeout(() => el.element.classList.remove('bouncing'), 300);
                }
            }

            checkCollisions() {
                for (let i = 0; i < this.elements.length; i++) {
                    for (let j = i + 1; j < this.elements.length; j++) {
                        const el1 = this.elements[i];
                        const el2 = this.elements[j];
                        
                        if (this.isColliding(el1, el2)) {
                            this.resolveCollision(el1, el2);
                            this.collisionCount++;
                            
                            // Create collision effect
                            const centerX = (el1.physics.x + el2.physics.x) / 2;
                            const centerY = (el1.physics.y + el2.physics.y) / 2;
                            this.createCollisionEffect(centerX, centerY);
                            
                            el1.element.classList.add('bouncing');
                            el2.element.classList.add('bouncing');
                            setTimeout(() => {
                                el1.element.classList.remove('bouncing');
                                el2.element.classList.remove('bouncing');
                            }, 300);
                        }
                    }
                }
            }

            isColliding(el1, el2) {
                return !(el1.physics.x + el1.physics.width < el2.physics.x ||
                        el2.physics.x + el2.physics.width < el1.physics.x ||
                        el1.physics.y + el1.physics.height < el2.physics.y ||
                        el2.physics.y + el2.physics.height < el1.physics.y);
            }

            resolveCollision(el1, el2) {
                // Simple elastic collision
                const tempVx = el1.physics.vx;
                const tempVy = el1.physics.vy;
                
                el1.physics.vx = el2.physics.vx * this.bounceFactor;
                el1.physics.vy = el2.physics.vy * this.bounceFactor;
                el2.physics.vx = tempVx * this.bounceFactor;
                el2.physics.vy = tempVy * this.bounceFactor;
                
                // Separate overlapping elements
                const overlapX = (el1.physics.x + el1.physics.width) - el2.physics.x;
                const overlapY = (el1.physics.y + el1.physics.height) - el2.physics.y;
                
                if (Math.abs(overlapX) < Math.abs(overlapY)) {
                    el1.physics.x -= overlapX / 2;
                    el2.physics.x += overlapX / 2;
                } else {
                    el1.physics.y -= overlapY / 2;
                    el2.physics.y += overlapY / 2;
                }
            }

            updateElementPosition(el) {
                el.element.style.left = el.physics.x + 'px';
                el.element.style.top = el.physics.y + 'px';
                el.element.style.transform = `rotate(${el.physics.rotation}rad)`;
            }

            createTrail(x, y) {
                // Create multiple trail types for variety
                const trailTypes = ['', 'spark', 'energy'];
                const randomType = trailTypes[Math.floor(Math.random() * trailTypes.length)];
                
                const trail = document.createElement('div');
                trail.className = `trail ${randomType}`;
                trail.style.left = (x - 2.5) + 'px';
                trail.style.top = (y - 2.5) + 'px';
                
                // Add random rotation for more organic feel
                trail.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(trail);
                
                // Vary cleanup time based on trail type
                const cleanupTime = randomType === 'energy' ? 2500 : randomType === 'spark' ? 1500 : 2000;
                
                setTimeout(() => {
                    if (trail.parentNode) {
                        trail.parentNode.removeChild(trail);
                    }
                }, cleanupTime);
            }

            createCollisionEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'collision-effect';
                effect.style.left = (x - 20) + 'px';
                effect.style.top = (y - 20) + 'px';
                
                // Add random rotation for variety
                effect.style.transform = `rotate(${Math.random() * 360}deg)`;
                
                document.body.appendChild(effect);
                
                // Create additional particle burst
                this.createParticleBurst(x, y);
                
                setTimeout(() => {
                    if (effect.parentNode) {
                        effect.parentNode.removeChild(effect);
                    }
                }, 1000);
            }

            createParticleBurst(x, y) {
                const particleCount = 8;
                for (let i = 0; i < particleCount; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'trail spark';

                    const angle = (i / particleCount) * Math.PI * 2;
                    const distance = 20 + Math.random() * 30;
                    const particleX = x + Math.cos(angle) * distance;
                    const particleY = y + Math.sin(angle) * distance;

                    particle.style.left = particleX + 'px';
                    particle.style.top = particleY + 'px';
                    particle.style.animationDelay = (i * 0.05) + 's';

                    document.body.appendChild(particle);

                    setTimeout(() => {
                        if (particle.parentNode) {
                            particle.parentNode.removeChild(particle);
                        }
                    }, 1500);
                }
            }

            createEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'trail';

                effect.style.left = (x - 10) + 'px';
                effect.style.top = (y - 10) + 'px';

                document.body.appendChild(effect);

                setTimeout(() => {
                    if (effect.parentNode) {
                        effect.parentNode.removeChild(effect);
                    }
                }, 500);
            }

            updateStats() {
                document.getElementById('elementCount').textContent = this.elements.length;
                document.getElementById('collisionCount').textContent = this.collisionCount;
                
                const totalVelocity = this.elements.reduce((sum, el) => {
                    return sum + Math.sqrt(el.physics.vx * el.physics.vx + el.physics.vy * el.physics.vy);
                }, 0);
                
                const avgVelocity = this.elements.length > 0 ? (totalVelocity / this.elements.length).toFixed(1) : 0;
                document.getElementById('avgVelocity').textContent = avgVelocity;
                
                // Calculate system energy as a percentage
                const maxEnergy = this.elements.length * 20; // Theoretical max
                const currentEnergy = Math.min(totalVelocity, maxEnergy);
                const energyPercent = maxEnergy > 0 ? Math.round((currentEnergy / maxEnergy) * 100) : 0;
                document.getElementById('systemEnergy').textContent = energyPercent;
            }

            applyGravityWave() {
                // Create a gravity wave effect that propagates through all elements
                this.elements.forEach((el, index) => {
                    setTimeout(() => {
                        const angle = Math.random() * Math.PI * 2;
                        const force = 8 + Math.random() * 12;
                        el.physics.vx += Math.cos(angle) * force;
                        el.physics.vy += Math.sin(angle) * force;
                        el.physics.angularVelocity += (Math.random() - 0.5) * 0.3;
                        
                        // Visual feedback
                        el.element.classList.add('active');
                        setTimeout(() => {
                            el.element.classList.remove('active');
                        }, 2000);
                    }, index * 100);
                });
            }

            updateElementCount() {
                document.getElementById('elementCount').textContent = this.elements.length;
            }

            startPhysicsLoop() {
                const loop = () => {
                    this.updatePhysics();
                    requestAnimationFrame(loop);
                };
                requestAnimationFrame(loop);
            }

            reset() {
                this.elements.forEach(el => {
                    if (el.element.parentNode) {
                        el.element.parentNode.removeChild(el.element);
                    }
                });
                this.elements = [];
                this.collisionCount = 0;
                this.createInitialElements();
            }

            toggleTrails() {
                this.showTrails = !this.showTrails;
            }

            addRandomElement() {
                const types = ['card', 'button', 'circular-button', 'notification', 'slider-element'];
                const type = types[Math.floor(Math.random() * types.length)];
                const x = Math.random() * (window.innerWidth - 300);
                const y = Math.random() * (window.innerHeight - 200);
                
                let content = '';
                switch(type) {
                    case 'card':
                        content = '<h3>Dynamic Element</h3><p>This element was created dynamically with realistic physics.</p>';
                        break;
                    case 'button':
                        content = 'New Action';
                        break;
                    case 'circular-button':
                        const icons = ['🌟', '⚡', '🔥', '💫', '🚀', '⭐'];
                        content = icons[Math.floor(Math.random() * icons.length)];
                        break;
                    case 'notification':
                        content = '<div class="title">New Message</div><div>A new floating element has joined the microgravity environment.</div>';
                        break;
                    case 'slider-element':
                        content = '<span>Control</span><input type="range" class="mini-slider" min="0" max="100" value="50">';
                        break;
                }
                
                this.createElement(type, x, y, content);
            }
        }

        // Global functions for buttons
        function addRandomElement() {
            simulator.addRandomElement();
        }

        function resetSimulation() {
            simulator.reset();
        }

        function toggleTrails() {
            simulator.toggleTrails();
        }

        function applyGravityWave() {
            simulator.applyGravityWave();
        }

        // Initialize the simulator
        const simulator = new MicrogravitySimulator();

        // Add some visual flair on load
        setTimeout(() => {
            simulator.applyRandomForces();
        }, 1000);
    </script>
</body>
</html>
