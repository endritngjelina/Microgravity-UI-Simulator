<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microgravity UI Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'SF Pro Display', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%),
                linear-gradient(135deg, #0c0c0c 0%, #191654 50%, #43073e 100%);
            overflow: hidden;
            height: 100vh;
            position: relative;
            cursor: none;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s infinite ease-in-out;
            filter: blur(0.5px);
        }

        .star::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            top: 50%;
            left: -50%;
            transform: translateY(-50%);
            animation: starGlow 4s infinite ease-in-out;
        }

        .star::after {
            content: '';
            position: absolute;
            width: 1px;
            height: 200%;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.8), transparent);
            left: 50%;
            top: -50%;
            transform: translateX(-50%);
            animation: starGlow 4s infinite ease-in-out reverse;
        }

        @keyframes starGlow {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 2;
        }

        .floating-element {
            position: absolute;
            cursor: grab;
            user-select: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 16px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 1px 0 rgba(255, 255, 255, 0.1) inset,
                0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .floating-element::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
            pointer-events: none;
        }

        .floating-element:hover::before {
            left: 100%;
        }

        .floating-element:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(120, 119, 198, 0.3),
                0 1px 0 rgba(255, 255, 255, 0.2) inset;
        }

        .floating-element:active {
            cursor: grabbing;
            transform: scale(1.08) rotateZ(2deg);
            filter: brightness(1.2);
        }

        .floating-element.dragging {
            z-index: 1000;
            box-shadow: 
                0 25px 80px rgba(0, 0, 0, 0.6),
                0 0 60px rgba(0, 255, 255, 0.4),
                0 0 0 2px rgba(0, 255, 255, 0.5);
            transform: scale(1.08) rotateZ(2deg);
            filter: brightness(1.3) saturate(1.2);
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 32px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            min-width: 140px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.5px;
        }

        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .button:hover::before {
            opacity: 1;
        }

        .button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 
                0 15px 35px rgba(102, 126, 234, 0.4),
                0 5px 15px rgba(0, 0, 0, 0.3);
            filter: brightness(1.1);
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 24px;
            width: 300px;
            min-height: 180px;
            backdrop-filter: blur(25px) saturate(180%);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .card h3 {
            color: #fff;
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #fff 0%, #e0e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .card p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            font-size: 14px;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .toggle {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .toggle.active {
            background: linear-gradient(135deg, #00d2ff 0%, #3a47d5 100%);
        }

        .slider {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            width: 200px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .slider input {
            width: 100%;
            margin-top: 10px;
        }

        .slider label {
            color: white;
            font-size: 12px;
            font-weight: 600;
        }

        .controls {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            max-width: 400px;
        }

        .control-btn {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.3),
                0 0 20px rgba(120, 119, 198, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .control-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .physics-info {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 20px;
            border-radius: 16px;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            backdrop-filter: blur(20px);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            min-width: 200px;
            line-height: 1.6;
        }

        .physics-info::before {
            content: '◉ SYSTEM STATUS';
            display: block;
            color: #00ff88;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .trajectory {
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }

        .trajectory-point {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 255, 0.6);
            border-radius: 50%;
        }

        .collision-effect {
            position: absolute;
            pointer-events: none;
            z-index: 999;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            animation: particle-fade 1s ease-out forwards;
        }

        @keyframes particle-fade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        .force-field {
            position: absolute;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: none;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .velocity-vector {
            position: absolute;
            height: 3px;
            background: linear-gradient(90deg, rgba(255, 0, 100, 0.9), rgba(255, 0, 100, 0.3), transparent);
            transform-origin: left center;
            pointer-events: none;
            z-index: 999;
            border-radius: 2px;
            box-shadow: 0 0 8px rgba(255, 0, 100, 0.5);
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.8) 0%, transparent 70%);
            border: 2px solid rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.1s ease;
            mix-blend-mode: screen;
        }

        .custom-cursor::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            background: #00ffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Improved Particle Effects */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: particle-fade 1.2s ease-out forwards;
            box-shadow: 0 0 6px currentColor;
        }

        @keyframes particle-fade {
            0% { 
                opacity: 1; 
                transform: scale(1);
                filter: brightness(2);
            }
            100% { 
                opacity: 0; 
                transform: scale(0.2);
                filter: brightness(0.5);
            }
        }

        /* Loading Animation */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0c0c0c 0%, #191654 50%, #43073e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-text {
            color: white;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .loading-text::after {
            content: '';
            display: inline-block;
            width: 4px;
            height: 24px;
            background: #00ffff;
            margin-left: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-text">INITIALIZING MICROGRAVITY SIMULATION</div>
    </div>
    
    <div class="custom-cursor" id="customCursor"></div>
    <div class="stars" id="stars"></div>
    
    <div class="controls">
        <button class="control-btn" onclick="addRandomElement()">Add Element</button>
        <button class="control-btn" onclick="toggleGravity()">Toggle Gravity</button>
        <button class="control-btn" onclick="toggleCollisions()">Collisions: ON</button>
        <button class="control-btn" onclick="resetSimulation()">Reset</button>
        <button class="control-btn" onclick="toggleTrajectories()">Trajectories</button>
        <button class="control-btn" onclick="addForceField()">Force Field</button>
    </div>

    <div class="physics-info" id="physicsInfo">
        Elements: 0<br>
        Gravity: OFF<br>
        Collisions: ON<br>
        Physics Engine: Active
    </div>

    <div class="container" id="container"></div>

    <script>
        class PhysicsEngine {
            constructor() {
                this.elements = [];
                this.gravity = { x: 0, y: 0 };
                this.friction = 0.995;
                this.collision = true;
                this.showTrajectories = false;
                this.forceFields = [];
                this.animationId = null;
                this.container = document.getElementById('container');
                this.physicsInfo = document.getElementById('physicsInfo');
                
                this.init();
            }

            init() {
                this.createStars();
                this.setupCustomCursor();
                this.addInitialElements();
                this.bindEvents();
                this.startPhysicsLoop();
                this.hideLoadingScreen();
            }

            setupCustomCursor() {
                const cursor = document.getElementById('customCursor');
                document.addEventListener('mousemove', (e) => {
                    cursor.style.left = (e.clientX - 10) + 'px';
                    cursor.style.top = (e.clientY - 10) + 'px';
                });

                document.addEventListener('mousedown', () => {
                    cursor.style.transform = 'scale(0.8)';
                });

                document.addEventListener('mouseup', () => {
                    cursor.style.transform = 'scale(1)';
                });
            }

            hideLoadingScreen() {
                setTimeout(() => {
                    const overlay = document.getElementById('loadingOverlay');
                    overlay.classList.add('hidden');
                    setTimeout(() => overlay.remove(), 1000);
                }, 2000);
            }

            createStars() {
                const starsContainer = document.getElementById('stars');
                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + '%';
                    star.style.top = Math.random() * 100 + '%';
                    star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
                    star.style.animationDelay = Math.random() * 3 + 's';
                    starsContainer.appendChild(star);
                }
            }

            addInitialElements() {
                const elements = [
                    { type: 'button', text: 'Launch Mission', x: 200, y: 200 },
                    { type: 'card', title: 'Space Station Alpha', content: 'Monitoring orbital mechanics and gravitational fields in real-time simulation.', x: 500, y: 150 },
                    { type: 'toggle', text: 'Thrusters', x: 800, y: 300 },
                    { type: 'slider', label: 'Engine Power', x: 300, y: 400 },
                    { type: 'button', text: 'Navigation', x: 700, y: 500 },
                    { type: 'card', title: 'Mission Control', content: 'Advanced physics simulation with realistic collision detection and momentum conservation.', x: 100, y: 600 }
                ];

                elements.forEach(elementData => this.createElement(elementData));
            }

            createElement(data) {
                const element = document.createElement('div');
                element.className = 'floating-element';
                
                switch(data.type) {
                    case 'button':
                        element.className += ' button';
                        element.textContent = data.text;
                        break;
                    case 'card':
                        element.className += ' card';
                        element.innerHTML = `<h3>${data.title}</h3><p>${data.content}</p>`;
                        break;
                    case 'toggle':
                        element.className += ' toggle';
                        element.textContent = data.text;
                        break;
                    case 'slider':
                        element.className += ' slider';
                        element.innerHTML = `<label>${data.label}</label><input type="range" min="0" max="100" value="50">`;
                        break;
                }

                element.style.left = data.x + 'px';
                element.style.top = data.y + 'px';

                const physicsObject = {
                    element: element,
                    x: data.x,
                    y: data.y,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    mass: 1 + Math.random(),
                    isDragging: false,
                    trajectory: [],
                    lastCollision: 0
                };

                this.elements.push(physicsObject);
                this.container.appendChild(element);
                this.bindElementEvents(physicsObject);
                this.updateInfo();
            }

            bindElementEvents(physicsObject) {
                const element = physicsObject.element;
                let startX, startY, initialMouseX, initialMouseY;

                element.addEventListener('mousedown', (e) => {
                    physicsObject.isDragging = true;
                    element.classList.add('dragging');
                    startX = physicsObject.x;
                    startY = physicsObject.y;
                    initialMouseX = e.clientX;
                    initialMouseY = e.clientY;
                    physicsObject.vx = 0;
                    physicsObject.vy = 0;
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (physicsObject.isDragging) {
                        const deltaX = e.clientX - initialMouseX;
                        const deltaY = e.clientY - initialMouseY;
                        physicsObject.x = startX + deltaX;
                        physicsObject.y = startY + deltaY;
                        element.style.left = physicsObject.x + 'px';
                        element.style.top = physicsObject.y + 'px';
                    }
                });

                document.addEventListener('mouseup', (e) => {
                    if (physicsObject.isDragging) {
                        physicsObject.isDragging = false;
                        element.classList.remove('dragging');
                        
                        // Calculate release velocity
                        const deltaX = e.clientX - initialMouseX;
                        const deltaY = e.clientY - initialMouseY;
                        physicsObject.vx = deltaX * 0.1;
                        physicsObject.vy = deltaY * 0.1;
                    }
                });
            }

            bindEvents() {
                // Touch events for mobile support
                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousedown', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    e.target.dispatchEvent(mouseEvent);
                });

                this.container.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent('mousemove', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    document.dispatchEvent(mouseEvent);
                });

                this.container.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    const mouseEvent = new MouseEvent('mouseup', {});
                    document.dispatchEvent(mouseEvent);
                });
            }

            startPhysicsLoop() {
                const update = () => {
                    this.updatePhysics();
                    this.animationId = requestAnimationFrame(update);
                };
                update();
            }

            updatePhysics() {
                const now = Date.now();
                
                this.elements.forEach(obj => {
                    if (obj.isDragging) return;

                    // Apply gravity
                    obj.vx += this.gravity.x;
                    obj.vy += this.gravity.y;

                    // Apply force fields
                    this.forceFields.forEach(field => {
                        const dx = field.x - obj.x;
                        const dy = field.y - obj.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);
                        
                        if (distance < field.radius) {
                            const force = field.strength / (distance * distance + 1);
                            obj.vx += (dx / distance) * force;
                            obj.vy += (dy / distance) * force;
                        }
                    });

                    // Apply friction
                    obj.vx *= this.friction;
                    obj.vy *= this.friction;

                    // Update position
                    obj.x += obj.vx;
                    obj.y += obj.vy;

                    // Boundary collision
                    const rect = obj.element.getBoundingClientRect();
                    const containerRect = this.container.getBoundingClientRect();
                    
                    if (obj.x < 0) {
                        obj.x = 0;
                        obj.vx = -obj.vx * 0.8;
                        this.createBounceEffect(obj.x, obj.y);
                    }
                    if (obj.x + rect.width > containerRect.width) {
                        obj.x = containerRect.width - rect.width;
                        obj.vx = -obj.vx * 0.8;
                        this.createBounceEffect(obj.x + rect.width, obj.y);
                    }
                    if (obj.y < 0) {
                        obj.y = 0;
                        obj.vy = -obj.vy * 0.8;
                        this.createBounceEffect(obj.x, obj.y);
                    }
                    if (obj.y + rect.height > containerRect.height) {
                        obj.y = containerRect.height - rect.height;
                        obj.vy = -obj.vy * 0.8;
                        this.createBounceEffect(obj.x, obj.y + rect.height);
                    }

                    // Update DOM position
                    obj.element.style.left = obj.x + 'px';
                    obj.element.style.top = obj.y + 'px';

                    // Update trajectory
                    if (this.showTrajectories) {
                        obj.trajectory.push({ x: obj.x, y: obj.y, time: now });
                        obj.trajectory = obj.trajectory.filter(point => now - point.time < 2000);
                        this.drawTrajectory(obj);
                    }

                    // Update velocity vector
                    this.drawVelocityVector(obj);
                });

                // Collision detection
                if (this.collision) {
                    this.checkCollisions();
                }
            }

            checkCollisions() {
                for (let i = 0; i < this.elements.length; i++) {
                    for (let j = i + 1; j < this.elements.length; j++) {
                        const obj1 = this.elements[i];
                        const obj2 = this.elements[j];
                        
                        if (obj1.isDragging || obj2.isDragging) continue;

                        const rect1 = obj1.element.getBoundingClientRect();
                        const rect2 = obj2.element.getBoundingClientRect();

                        if (this.isColliding(rect1, rect2)) {
                            this.resolveCollision(obj1, obj2);
                            this.createCollisionEffect((obj1.x + obj2.x) / 2, (obj1.y + obj2.y) / 2);
                        }
                    }
                }
            }

            isColliding(rect1, rect2) {
                return !(rect1.right < rect2.left || 
                        rect1.left > rect2.right || 
                        rect1.bottom < rect2.top || 
                        rect1.top > rect2.bottom);
            }

            resolveCollision(obj1, obj2) {
                const now = Date.now();
                if (now - obj1.lastCollision < 100 || now - obj2.lastCollision < 100) return;

                obj1.lastCollision = obj2.lastCollision = now;

                // Calculate collision normal
                const dx = obj2.x - obj1.x;
                const dy = obj2.y - obj1.y;
                const distance = Math.sqrt(dx * dx + dy * dy) || 1;
                const nx = dx / distance;
                const ny = dy / distance;

                // Relative velocity
                const dvx = obj2.vx - obj1.vx;
                const dvy = obj2.vy - obj1.vy;
                const dvn = dvx * nx + dvy * ny;

                // Do not resolve if velocities are separating
                if (dvn > 0) return;

                // Collision impulse
                const impulse = 2 * dvn / (obj1.mass + obj2.mass);
                
                obj1.vx += impulse * obj2.mass * nx;
                obj1.vy += impulse * obj2.mass * ny;
                obj2.vx -= impulse * obj1.mass * nx;
                obj2.vy -= impulse * obj1.mass * ny;

                // Separate objects
                const overlap = 10;
                obj1.x -= nx * overlap / 2;
                obj1.y -= ny * overlap / 2;
                obj2.x += nx * overlap / 2;
                obj2.y += ny * overlap / 2;
            }

            createBounceEffect(x, y) {
                const colors = ['#00ffff', '#ff00ff', '#ffff00', '#ff6b6b', '#4ecdc4'];
                
                for (let i = 0; i < 12; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (i / 12) * Math.PI * 2;
                    const velocity = 40 + Math.random() * 60;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    particle.style.transform = `translate(${vx}px, ${vy}px)`;
                    
                    this.container.appendChild(particle);
                    setTimeout(() => particle.remove(), 1200);
                }

                // Add screen shake effect
                document.body.style.animation = 'shake 0.3s ease-in-out';
                setTimeout(() => document.body.style.animation = '', 300);
            }

            createCollisionEffect(x, y) {
                const effect = document.createElement('div');
                effect.className = 'collision-effect';
                effect.style.left = x + 'px';
                effect.style.top = y + 'px';
                
                const colors = ['#ff0080', '#00ff80', '#8000ff', '#ff8000', '#0080ff'];
                
                for (let i = 0; i < 16; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                    
                    const angle = (i / 16) * Math.PI * 2;
                    const velocity = 50 + Math.random() * 70;
                    const vx = Math.cos(angle) * velocity;
                    const vy = Math.sin(angle) * velocity;
                    
                    particle.style.transform = `translate(${vx}px, ${vy}px)`;
                    effect.appendChild(particle);
                }
                
                this.container.appendChild(effect);
                setTimeout(() => effect.remove(), 1200);

                // Add subtle glow effect to container
                this.container.style.boxShadow = `inset 0 0 100px rgba(255, 255, 255, 0.1)`;
                setTimeout(() => this.container.style.boxShadow = '', 200);
            }

            drawTrajectory(obj) {
                // Remove old trajectory
                const oldTrajectory = obj.element.querySelector('.trajectory');
                if (oldTrajectory) oldTrajectory.remove();

                if (obj.trajectory.length < 2) return;

                const trajectory = document.createElement('div');
                trajectory.className = 'trajectory';
                
                obj.trajectory.forEach((point, index) => {
                    if (index === 0) return;
                    
                    const dot = document.createElement('div');
                    dot.className = 'trajectory-point';
                    dot.style.left = point.x + 'px';
                    dot.style.top = point.y + 'px';
                    dot.style.opacity = index / obj.trajectory.length;
                    trajectory.appendChild(dot);
                });
                
                this.container.appendChild(trajectory);
                setTimeout(() => trajectory.remove(), 100);
            }

            drawVelocityVector(obj) {
                // Remove old vector
                const oldVector = this.container.querySelector(`[data-vector="${obj.element.id}"]`);
                if (oldVector) oldVector.remove();

                const speed = Math.sqrt(obj.vx * obj.vx + obj.vy * obj.vy);
                if (speed < 1) return;

                const vector = document.createElement('div');
                vector.className = 'velocity-vector';
                vector.setAttribute('data-vector', obj.element.id || Math.random());
                
                const length = Math.min(speed * 5, 100);
                const angle = Math.atan2(obj.vy, obj.vx) * 180 / Math.PI;
                
                vector.style.left = (obj.x + 20) + 'px';
                vector.style.top = (obj.y + 20) + 'px';
                vector.style.width = length + 'px';
                vector.style.transform = `rotate(${angle}deg)`;
                vector.style.opacity = Math.min(speed / 10, 1);
                
                this.container.appendChild(vector);
                setTimeout(() => vector.remove(), 100);
            }

            updateInfo() {
                this.physicsInfo.innerHTML = `
                    Elements: ${this.elements.length}<br>
                    Gravity: ${this.gravity.y === 0 ? 'OFF' : 'ON'}<br>
                    Collisions: ${this.collision ? 'ON' : 'OFF'}<br>
                    Force Fields: ${this.forceFields.length}<br>
                    Physics Engine: Active
                `;
            }

            toggleGravity() {
                this.gravity.y = this.gravity.y === 0 ? 0.2 : 0;
                this.updateInfo();
            }

            toggleCollisions() {
                this.collision = !this.collision;
                const btn = document.querySelector('.control-btn:nth-child(3)');
                btn.textContent = `Collisions: ${this.collision ? 'ON' : 'OFF'}`;
                this.updateInfo();
            }

            toggleTrajectories() {
                this.showTrajectories = !this.showTrajectories;
                const btn = document.querySelector('.control-btn:nth-child(5)');
                btn.textContent = `Trajectories: ${this.showTrajectories ? 'ON' : 'OFF'}`;
            }

            addRandomElement() {
                const types = ['button', 'card', 'toggle', 'slider'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                const elementData = {
                    type: type,
                    x: Math.random() * (window.innerWidth - 300),
                    y: Math.random() * (window.innerHeight - 200)
                };

                switch(type) {
                    case 'button':
                        elementData.text = ['Deploy', 'Activate', 'Launch', 'Execute', 'Initialize'][Math.floor(Math.random() * 5)];
                        break;
                    case 'card':
                        elementData.title = ['System Status', 'Navigation Data', 'Mission Log', 'Sensor Array'][Math.floor(Math.random() * 4)];
                        elementData.content = 'Advanced UI element floating in zero gravity simulation environment.';
                        break;
                    case 'toggle':
                        elementData.text = ['Shields', 'Radar', 'Comms', 'Auto-pilot'][Math.floor(Math.random() * 4)];
                        break;
                    case 'slider':
                        elementData.label = ['Power', 'Speed', 'Signal', 'Thrust'][Math.floor(Math.random() * 4)];
                        break;
                }

                this.createElement(elementData);
            }

            addForceField() {
                const field = {
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    radius: 100 + Math.random() * 100,
                    strength: (Math.random() - 0.5) * 0.5
                };

                this.forceFields.push(field);

                // Visual representation
                const fieldElement = document.createElement('div');
                fieldElement.className = 'force-field';
                fieldElement.style.left = (field.x - field.radius) + 'px';
                fieldElement.style.top = (field.y - field.radius) + 'px';
                fieldElement.style.width = fieldElement.style.height = (field.radius * 2) + 'px';
                fieldElement.style.borderColor = field.strength > 0 ? 'rgba(0, 255, 0, 0.3)' : 'rgba(255, 0, 0, 0.3)';
                
                this.container.appendChild(fieldElement);
                this.updateInfo();

                // Remove after 10 seconds
                setTimeout(() => {
                    fieldElement.remove();
                    const index = this.forceFields.indexOf(field);
                    if (index > -1) this.forceFields.splice(index, 1);
                    this.updateInfo();
                }, 10000);
            }

            reset() {
                this.elements.forEach(obj => obj.element.remove());
                this.elements = [];
                this.forceFields = [];
                document.querySelectorAll('.force-field').forEach(el => el.remove());
                this.addInitialElements();
            }
        }

        // Global functions for controls
        let physicsEngine;

        function addRandomElement() {
            physicsEngine.addRandomElement();
        }

        function toggleGravity() {
            physicsEngine.toggleGravity();
        }

        function toggleCollisions() {
            physicsEngine.toggleCollisions();
        }

        function resetSimulation() {
            physicsEngine.reset();
        }

        function toggleTrajectories() {
            physicsEngine.toggleTrajectories();
        }

        function addForceField() {
            physicsEngine.addForceField();
        }

        // Initialize the physics engine
        window.addEventListener('load', () => {
            physicsEngine = new PhysicsEngine();
        });

        // Prevent context menu on right click
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
